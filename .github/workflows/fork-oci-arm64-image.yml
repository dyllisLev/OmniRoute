name: Build OCI arm64 image

on:
  push:
    branches:
      - "arin/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-oci-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dyllislev/omniroute

jobs:
  build:
    name: Build and publish arm64 runtime image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish OCI runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:ko-latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=oci-arm64-runtime
          cache-to: type=gha,scope=oci-arm64-runtime,mode=max

      - name: Verify published arm64 image
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}"

      - name: Make linked public-fork package publicly pullable
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "/user/packages/container/omniroute/visibility" \
            -f visibility=public
